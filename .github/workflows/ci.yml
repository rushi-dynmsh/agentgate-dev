name: CI

# Single CI workflow for the AgentGate repository.
#
# The Go module lives in agentgate/ (module path
# "github.com/Dynamisch-LLC/agentgate"), per docs/PROJECT_DEFINITION.md §11's
# top-level layout — the repository root
# also holds docs/ and, in later phases, non-Go artifacts (gateway config,
# Cedar policies, migrations). Every Go step below runs with
# working-directory: agentgate and is gated on agentgate/go.mod existing,
# so this workflow degrades gracefully (green, with a notice) on any commit
# that predates the Go module and requires no further edits now that it
# exists.
#
# See docs/DEVELOPMENT/CI_BASELINE.md for the rationale and what is
# intentionally deferred to a later phase (Docker builds, SBOM, signing,
# deployment, integration containers).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentgate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing below assumes the Go module exists. If a future commit
      # ever removes it, this step reports the skip and the job still ends
      # green — there is no code to validate, and CI must not fabricate a
      # fake module just to exercise itself.
      - name: Detect Go module
        id: gomod
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No agentgate/go.mod present. Go validation steps are skipped (see docs/DEVELOPMENT/CI_BASELINE.md)."
          fi

      - name: Set up Go
        if: steps.gomod.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: agentgate/go.mod
          check-latest: true

      - name: Check formatting (gofmt)
        if: steps.gomod.outputs.exists == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...

      - name: go test (race-enabled)
        if: steps.gomod.outputs.exists == 'true'
        run: go test -race ./...

      - name: golangci-lint
        if: steps.gomod.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: agentgate

      - name: govulncheck
        if: steps.gomod.outputs.exists == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  g6-live-e2e:
    name: G6 live enforcement E2E
    runs-on: ubuntu-latest
    # DoD item 4, G7 Task A (docs/PHASES/G7_WORKSTREAMS/02_AI_GATEWAY_G7.md §2):
    # ubuntu-latest ships both Docker and PowerShell Core (pwsh) by default, so
    # this runs the exact same script a developer runs locally — no duplicated
    # logic, no separate CI-only test path. No secrets needed: every credential
    # deploy/g6 uses is an explicit, checked-in dev fixture (see
    # docker-compose.yml's top comment and deploy/g6/jwks/README.md).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the G6 live enforcement matrix
        shell: pwsh
        run: ./run-e2e-matrix.ps1
        working-directory: deploy/g6

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        working-directory: deploy/g6
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        shell: bash
        working-directory: deploy/g6
        run: docker compose down -v

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend package
        id: frontend_pkg
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.frontend_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_pkg.outputs.exists == 'true'
        run: npm ci

      - name: TypeScript typecheck
        if: steps.frontend_pkg.outputs.exists == 'true'
        run: npm run typecheck

      - name: Vitest tests
        if: steps.frontend_pkg.outputs.exists == 'true'
        run: npm test


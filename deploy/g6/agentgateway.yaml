# AgentGate — G6 agentgateway configuration (Real MCP Enforcement Gate)
# Pinned to cr.agentgateway.dev/agentgateway:v1.4.0@sha256:771afaf093065477fa296eb90dcb618a0300165f12a32f80bbdd1427fab900ec

gateways:
  default:
    port: 3000

    # --- JWT validation (agentgateway's job; AgentGate never re-verifies signatures) ---
    # Added G7 Task A: this block was missing entirely, meaning no request through
    # this topology could ever carry gateway-verified identity — internal/authz's
    # extractClaims trusts ONLY MetadataContext.FilterMetadata["envoy.filters.http.jwt_authn"],
    # never client headers (docs/SECURITY/PRODUCTION-INVARIANTS.md), so every call was
    # denied for missing identity regardless of what headers a client sent. Confirmed by
    # running probe-client against this exact topology before this fix:
    #   "AgentGate Authorization Denied: invalid_identity (missing_claim: required claim
    #   \"sub\" is absent)"
    # Schema mirrors gateway/config/g1-agentgateway.yaml's jwtAuth block, which was
    # already schema-validated against the real binary. Dev-only fixture key — see
    # deploy/g6/jwks/README.md; never a real secret, never used outside this topology.
    jwtAuth:
      mode: strict
      issuer: https://g6-dev-fixture.invalid/
      audiences: ["agentgate-g6"]
      jwks:
        file: ./jwks/dev-fixture-jwks.json

routes:
  - policies:
      extAuthz:
        host: agentgate:9001
        policies:
          http:
            requestTimeout: 5s
        protocol:
          grpc: {}
        failureMode: deny
        includeRequestBody:
          maxRequestBytes: 1048576
          allowPartialMessage: false
          packAsBytes: false
    backends:
      - host: probe-mcp:9100
